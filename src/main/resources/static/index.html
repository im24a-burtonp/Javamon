<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Javamon Register</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="logo">
        <img src="/images/logos/javamon.png" alt="logo">
    </div>
    <div class="credentialContainer">
        <h2>Register</h2>

        <form onsubmit="register(event)">
            <input id="regUser" placeholder="Username" required>
            <input id="regPass" placeholder="Password" type="password" required>
            <div class="error-message" id="errorMessage"></div>

            <a href="login.html">Already have an account?</a>

            <button type="submit">Register</button>
        </form>
    </div>

<script src="js/auth.js"></script>

</body>
</html>
